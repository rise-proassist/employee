services:
  mysql:
    image: mysql:8.0
    container_name: employee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee
      MYSQL_USER: employee
      MYSQL_PASSWORD: employee
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
