<script type="text/javascript">

function exec() {
	if(window.confirm('削除します。よろしいですか？（削除した情報は元に戻せません。）')) {
		document.frm.submit();
	}
}

</script>

<div class="panel">
	
	<div class="panel-heading">
		<h3 class="panel-title">システムユーザ削除</h3>
	</div>
	
	<div class="panel-body">

		以下のシステムユーザを削除します。よろしいですか？<br />
		<br />

		{if isset($error_messages)}
			{foreach from=$error_messages item=$error_message}
			<div class="alert alert-danger alert-dismissible" role="alert">
				<button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">×</span></button>
				<i class="fa fa-times-circle"></i> {$error_message}<br>
			</div>
			{/foreach}
		{/if}

		{* フォーム *}
		<form method="post" action="/adminUser/delFinish" id="form" name="frm" novalidate="novalidate">
			<input type="hidden" name="id" value="{$admin_user->id}" />
			<table class="input_form">
				<tbody>
					<tr>
						<th>ユーザ名</th>
						<td>{$admin_user->name}</td>
					</tr>
					<tr>
						<th>メールアドレス</th>
						<td>{$admin_user->email}</td>
					</tr>
					<tr>
						<th>権限</th>
						<td>{$admin_user->auth_level_name}</td>
					</tr>
				</tbody>
			</table>
		</form>
		<br />
		<div class="frm_btn_area">
			<button type="button" class="btn btn-default" onclick="javascript:history.back();">戻る</button>
			<button type="button" class="btn btn-primary" onclick="exec();">削除</button>
		</div>
	</div>
</div>
