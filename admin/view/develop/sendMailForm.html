<script type="text/javascript">

function exec() {
	if(window.confirm('テストメールを配信します。よろしいですか？')) {
		document.frm.submit();
	}
}

</script>

<div class="panel">
	
	<div class="panel-heading">
		<h3 class="panel-title">テストメール配信</h3>
	</div>
	
	<div class="panel-body">

		テストメールの配信先メールアドレスを入力してください。<br />
		<br />

		{if isset($error_messages)}
			{foreach from=$error_messages item=$error_message}
			<div class="alert alert-danger alert-dismissible" role="alert">
				<button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">×</span></button>
				<i class="fa fa-times-circle"></i> {$error_message}<br>
			</div>
			{/foreach}
		{/if}

		{* フォーム *}
		<form method="post" action="{UtilCommon::get_base_url('develop', 'sendMailFinish')}" id="form" name="frm" novalidate="novalidate">
			<table class="input_form">
				<tbody>
					<tr>
						<th>
							メールアドレス<span class="reqire">*</span>
						</th>
						<td>
							{assign var="input_email" value=""}
							{if isset($smarty.post.email)}
								{assign var="input_email" value=$smarty.post.email}
							{/if}
							<input type="email" name="email" class="form-control" placeholder="taro@sample.com" value="{$input_email}">
						</td>
					</tr>
				</tbody>
			</table>
		</form>
		<br />
		<div class="frm_btn_area">
			<button type="button" class="btn btn-default" onclick="javascript:history.back();">戻る</button>
			<button type="button" class="btn btn-primary" onclick="exec();">送信</button>
		</div>
	</div>
</div>
