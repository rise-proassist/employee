<VirtualHost *:80>
    DocumentRoot /var/www/html/htdocs
    <Directory /var/www/html/htdocs>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/html/htdocs
    <Directory /var/www/html/htdocs>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/localhost.pem
    SSLCertificateKeyFile /etc/apache2/certs/localhost-key.pem
</VirtualHost>
